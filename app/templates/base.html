<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FraudLens - Transaction Fraud Detection{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1', // Neon Indigo
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        },
                        dark: {
                            900: '#09090b', // Zinc 950
                            800: '#18181b', // Zinc 900
                            700: '#27272a', // Zinc 800
                            600: '#3f3f46', // Zinc 700
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
        /* Glassmorphism custom classes */
        .glass-panel {
            background: rgba(24, 24, 27, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(63, 63, 70, 0.4);
        }
        .glow-indigo {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }
        .glow-green {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
        }
        .glow-red {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body class="bg-dark-900 text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-brand-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 w-full glass-panel border-b border-zinc-800/80 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <div class="flex items-center space-x-3">
                    <div class="bg-gradient-to-tr from-brand-600 to-indigo-400 p-2 rounded-xl text-white shadow-md shadow-brand-500/20">
                        <i class="fa-solid fa-shield-halved text-xl"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-zinc-200 to-brand-400 bg-clip-text text-transparent">
                        Fraud<span class="text-brand-500">Lens</span>
                    </span>
                </div>

                <!-- Navigation Links -->
                <nav class="hidden md:flex space-x-1 text-sm font-medium">
                    <a href="/" class="px-3 py-2 rounded-lg text-zinc-400 hover:text-white hover:bg-zinc-800/50 transition-all {% if active_page == 'upload' %}bg-zinc-800 text-white border-b-2 border-brand-500 rounded-b-none{% endif %}">
                        <i class="fa-solid fa-cloud-arrow-up mr-1.5"></i>Upload & Clean
                    </a>
                    <a href="/eda-dashboard" class="px-3 py-2 rounded-lg text-zinc-400 hover:text-white hover:bg-zinc-800/50 transition-all {% if active_page == 'eda' %}bg-zinc-800 text-white border-b-2 border-brand-500 rounded-b-none{% endif %}">
                        <i class="fa-solid fa-chart-pie mr-1.5"></i>EDA Dashboard
                    </a>
                    <a href="/train-dashboard" class="px-3 py-2 rounded-lg text-zinc-400 hover:text-white hover:bg-zinc-800/50 transition-all {% if active_page == 'train' %}bg-zinc-800 text-white border-b-2 border-brand-500 rounded-b-none{% endif %}">
                        <i class="fa-solid fa-dumbbell mr-1.5"></i>Model Training
                    </a>
                    <a href="/predict-dashboard" class="px-3 py-2 rounded-lg text-zinc-400 hover:text-white hover:bg-zinc-800/50 transition-all {% if active_page == 'predict' %}bg-zinc-800 text-white border-b-2 border-brand-500 rounded-b-none{% endif %}">
                        <i class="fa-solid fa-calculator mr-1.5"></i>Inference Center
                    </a>
                    <a href="/history-dashboard" class="px-3 py-2 rounded-lg text-zinc-400 hover:text-white hover:bg-zinc-800/50 transition-all {% if active_page == 'history' %}bg-zinc-800 text-white border-b-2 border-brand-500 rounded-b-none{% endif %}">
                        <i class="fa-solid fa-list-check mr-1.5"></i>Prediction Logs
                    </a>
                </nav>

                <!-- Mobile Menu Button -->
                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" class="text-zinc-400 hover:text-white focus:outline-none">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Navigation Menu -->
        <div id="mobile-menu" class="hidden md:hidden px-4 pt-2 pb-4 space-y-1 bg-dark-800 border-t border-zinc-800">
            <a href="/" class="block px-3 py-2 rounded-md text-base font-medium text-zinc-400 hover:text-white hover:bg-zinc-700">
                <i class="fa-solid fa-cloud-arrow-up mr-2"></i>Upload & Clean
            </a>
            <a href="/eda-dashboard" class="block px-3 py-2 rounded-md text-base font-medium text-zinc-400 hover:text-white hover:bg-zinc-700">
                <i class="fa-solid fa-chart-pie mr-2"></i>EDA Dashboard
            </a>
            <a href="/train-dashboard" class="block px-3 py-2 rounded-md text-base font-medium text-zinc-400 hover:text-white hover:bg-zinc-700">
                <i class="fa-solid fa-dumbbell mr-2"></i>Model Training
            </a>
            <a href="/predict-dashboard" class="block px-3 py-2 rounded-md text-base font-medium text-zinc-400 hover:text-white hover:bg-zinc-700">
                <i class="fa-solid fa-calculator mr-2"></i>Inference Center
            </a>
            <a href="/history-dashboard" class="block px-3 py-2 rounded-md text-base font-medium text-zinc-400 hover:text-white hover:bg-zinc-700">
                <i class="fa-solid fa-list-check mr-2"></i>Prediction Logs
            </a>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="w-full py-6 glass-panel border-t border-zinc-800/80 text-zinc-500 text-sm mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
            <div>
                &copy; 2026 FraudLens Platform. All rights reserved.
            </div>
            <div class="flex space-x-6 text-zinc-400">
                <span>Secure PCI-DSS Compliant Backend</span>
            </div>
        </div>
    </footer>

    <!-- Mobile Menu script -->
    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        if (btn && menu) {
            btn.addEventListener('click', () => {
                menu.classList.toggle('hidden');
            });
        }
    </script>
</body>
</html>
